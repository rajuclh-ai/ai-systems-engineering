model: gpt-4o-mini
temperature: 0

rag:
  dataset: datasets/arxiv_rag_testset.json
  # Number of Q&A pairs to synthesise when the dataset does not exist yet
  generate_n: 10
  thresholds:
    faithfulness: 0.70
    answer_relevance: 0.70
    context_recall: 0.65
    context_precision: 0.65

agent:
  dataset: datasets/pr_agent_testset.json
  thresholds:
    bug_recall: 0.70
    false_positive_rate: 0.40   # lower is better — this is the max allowed
    comment_quality: 0.60
