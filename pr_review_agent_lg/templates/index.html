<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR Review Agent — LangGraph Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; padding: 40px 20px; }
    .container { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 4px; }
    .subtitle { color: #8b949e; font-size: 0.9rem; margin-bottom: 32px; }
    .badge { display: inline-block; background: #1f6feb; color: #fff; font-size: 0.72rem; padding: 2px 8px; border-radius: 12px; margin-left: 8px; vertical-align: middle; }

    /* Input form */
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: #e6edf3; }
    label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 6px; }
    input[type=text], textarea {
      width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      color: #e6edf3; padding: 10px 12px; font-size: 0.9rem; outline: none;
      transition: border-color 0.15s;
    }
    input[type=text]:focus, textarea:focus { border-color: #1f6feb; }
    textarea { min-height: 140px; resize: vertical; font-family: monospace; font-size: 0.8rem; }
    .divider { text-align: center; color: #8b949e; font-size: 0.8rem; margin: 12px 0; }
    button {
      background: #1f6feb; color: #fff; border: none; border-radius: 6px;
      padding: 10px 24px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s; margin-top: 16px;
    }
    button:hover { background: #388bfd; }
    button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }

    /* Spinner */
    .spinner { display: none; text-align: center; padding: 40px; color: #8b949e; }
    .spinner.active { display: block; }
    .dot-spin { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #1f6feb; animation: pulse 1.2s infinite; margin: 0 3px; }
    .dot-spin:nth-child(2) { animation-delay: 0.2s; }
    .dot-spin:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,80%,100% { transform: scale(0.6); opacity:0.4; } 40% { transform: scale(1); opacity:1; } }

    /* Results */
    #results { display: none; }
    #results.active { display: block; }

    /* Verdict banner */
    .verdict { border-radius: 8px; padding: 20px 24px; margin-bottom: 24px; border: 1px solid; }
    .verdict.APPROVE         { background: #0d2818; border-color: #26a641; }
    .verdict.REQUEST_CHANGES { background: #2d0f0f; border-color: #f85149; }
    .verdict.NEEDS_DISCUSSION{ background: #271d02; border-color: #d29922; }
    .verdict-title { font-size: 1.2rem; font-weight: 700; }
    .verdict.APPROVE          .verdict-title { color: #3fb950; }
    .verdict.REQUEST_CHANGES  .verdict-title { color: #f85149; }
    .verdict.NEEDS_DISCUSSION .verdict-title { color: #d29922; }
    .verdict-summary  { color: #8b949e; margin-top: 6px; font-size: 0.9rem; }
    .verdict-reason   { color: #c9d1d9; margin-top: 8px; font-size: 0.85rem; }

    /* Agent cards */
    .agent-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    @media (max-width: 700px) { .agent-grid { grid-template-columns: 1fr; } }
    .agent-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
    .agent-card h3 { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; text-transform: capitalize; }
    .agent-card .meta { font-size: 0.78rem; color: #8b949e; margin-bottom: 8px; }
    .agent-card .count { font-size: 1.5rem; font-weight: 700; }
    .agent-card.security h3 { color: #f85149; }
    .agent-card.logic    h3 { color: #d29922; }
    .agent-card.style    h3 { color: #58a6ff; }
    .error-badge { font-size: 0.75rem; color: #f85149; margin-top: 4px; }

    /* Findings table */
    .findings-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
    .findings-card h2 { padding: 16px 20px; font-size: 1rem; border-bottom: 1px solid #30363d; }
    table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
    th { background: #0d1117; color: #8b949e; font-weight: 500; padding: 10px 14px; text-align: left; border-bottom: 1px solid #21262d; }
    td { padding: 10px 14px; border-bottom: 1px solid #21262d; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    .sev-HIGH   { color: #f85149; font-weight: 600; }
    .sev-MEDIUM { color: #d29922; font-weight: 600; }
    .sev-LOW    { color: #3fb950; font-weight: 600; }
    .cat-badge  { display: inline-block; font-size: 0.72rem; padding: 1px 7px; border-radius: 10px; }
    .cat-security { background: #2d0f0f; color: #f85149; }
    .cat-logic    { background: #271d02; color: #d29922; }
    .cat-style    { background: #0d2136; color: #58a6ff; }
    .no-findings  { padding: 24px; text-align: center; color: #8b949e; }

    /* Copy button */
    .copy-btn { float: right; font-size: 0.78rem; background: #21262d; color: #8b949e; border: 1px solid #30363d; border-radius: 6px; padding: 4px 12px; cursor: pointer; margin-top: -4px; }
    .copy-btn:hover { background: #30363d; color: #e6edf3; }

    /* Error */
    .error-card { background: #2d0f0f; border: 1px solid #f85149; border-radius: 8px; padding: 20px; color: #f85149; }
  </style>
</head>
<body>
<div class="container">
  <h1>PR Review Agent <span class="badge">LangGraph</span></h1>
  <p class="subtitle">Multi-agent code review · Security · Logic · Style · LangSmith traced</p>

  <!-- Input form -->
  <div class="card">
    <h2>Submit a PR for Review</h2>
    <label for="pr_url">GitHub PR URL</label>
    <input type="text" id="pr_url" placeholder="https://github.com/owner/repo/pull/123" />
    <div class="divider">— or paste a raw diff —</div>
    <label for="diff">Raw Diff</label>
    <textarea id="diff" placeholder="Paste your unified diff here..."></textarea>
    <button id="submit-btn" onclick="submitReview()">Review PR</button>
  </div>

  <!-- Spinner -->
  <div class="spinner" id="spinner">
    <div><span class="dot-spin"></span><span class="dot-spin"></span><span class="dot-spin"></span></div>
    <p style="margin-top:16px; font-size:0.9rem;">Running 3 specialist agents in parallel…</p>
    <p id="elapsed" style="color:#8b949e; font-size:0.8rem; margin-top:4px;"></p>
  </div>

  <!-- Results -->
  <div id="results">
    <div id="verdict-banner"></div>
    <div class="agent-grid" id="agent-cards"></div>
    <div class="findings-card">
      <h2>Findings <button class="copy-btn" onclick="copyMarkdown()">Copy as Markdown</button></h2>
      <div id="findings-body"></div>
    </div>
  </div>

  <div id="error-display"></div>
</div>

<script>
  let _markdownCache = "";
  let _startTime = 0;
  let _pollInterval = null;

  async function submitReview() {
    const prUrl = document.getElementById("pr_url").value.trim();
    const diff  = document.getElementById("diff").value.trim();

    if (!prUrl && !diff) {
      alert("Please enter a GitHub PR URL or paste a raw diff.");
      return;
    }

    document.getElementById("submit-btn").disabled = true;
    document.getElementById("results").classList.remove("active");
    document.getElementById("error-display").innerHTML = "";
    document.getElementById("spinner").classList.add("active");
    _startTime = Date.now();

    // Tick elapsed timer
    _pollInterval && clearInterval(_pollInterval);
    const elapsedEl = document.getElementById("elapsed");
    const tickTimer = setInterval(() => {
      elapsedEl.textContent = ((Date.now() - _startTime) / 1000).toFixed(1) + "s";
    }, 200);

    try {
      const res = await fetch("/reviews", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ pr_url: prUrl || null, diff: diff || null }),
      });
      if (!res.ok) { const e = await res.json(); throw new Error(e.detail || "Request failed"); }
      const { thread_id } = await res.json();
      pollStatus(thread_id, tickTimer);
    } catch (e) {
      clearInterval(tickTimer);
      showError(e.message);
    }
  }

  async function pollStatus(threadId, tickTimer) {
    _pollInterval = setInterval(async () => {
      try {
        const res = await fetch(`/reviews/${threadId}`);
        if (!res.ok) return;
        const data = await res.json();
        if (data.status === "completed") {
          clearInterval(_pollInterval);
          clearInterval(tickTimer);
          document.getElementById("spinner").classList.remove("active");
          document.getElementById("submit-btn").disabled = false;
          renderResults(data);
        } else if (data.status === "failed") {
          clearInterval(_pollInterval);
          clearInterval(tickTimer);
          document.getElementById("spinner").classList.remove("active");
          document.getElementById("submit-btn").disabled = false;
          showError(data.error || "Review failed");
        }
      } catch (e) { /* keep polling */ }
    }, 500);
  }

  function renderResults(data) {
    const report  = data.critic_report || {};
    const results = data.agent_results || [];
    const verdict = data.verdict || report.verdict || "NEEDS_DISCUSSION";

    // Verdict banner
    const icons = { APPROVE: "✅", REQUEST_CHANGES: "❌", NEEDS_DISCUSSION: "💬" };
    document.getElementById("verdict-banner").innerHTML = `
      <div class="verdict ${verdict}">
        <div class="verdict-title">${icons[verdict] || ""} ${verdict.replace(/_/g, " ")}</div>
        <div class="verdict-summary">${report.summary || ""}</div>
        <div class="verdict-reason">${report.verdict_reason || ""}</div>
      </div>`;

    // Agent cards
    const agentMap = {};
    results.forEach(r => { agentMap[r.agent] = r; });
    const agents = ["security", "logic", "style"];
    document.getElementById("agent-cards").innerHTML = agents.map(a => {
      const r = agentMap[a] || { findings: [], error: null, tokens_used: 0, duration_seconds: 0 };
      return `<div class="agent-card ${a}">
        <h3>${a}</h3>
        <div class="meta">${r.duration_seconds.toFixed(1)}s · ${r.tokens_used} tokens</div>
        <div class="count">${r.findings.length} finding${r.findings.length !== 1 ? "s" : ""}</div>
        ${r.error ? `<div class="error-badge">⚠ ${r.error}</div>` : ""}
      </div>`;
    }).join("");

    // Findings table
    const findings = report.findings || [];
    let tableHtml = "";
    if (findings.length === 0) {
      tableHtml = `<div class="no-findings">No issues found.</div>`;
    } else {
      tableHtml = `<table>
        <thead><tr><th>Severity</th><th>Category</th><th>File</th><th>Line</th><th>Issue</th><th>Suggestion</th></tr></thead>
        <tbody>${findings.map(f => `
          <tr>
            <td class="sev-${f.severity}">${f.severity}</td>
            <td><span class="cat-badge cat-${f.category}">${f.category}</span></td>
            <td><code>${f.file_name}</code></td>
            <td>${f.line_number}</td>
            <td>${f.message}</td>
            <td>${f.suggestion}</td>
          </tr>`).join("")}
        </tbody></table>`;
    }
    document.getElementById("findings-body").innerHTML = tableHtml;

    // Cache markdown for copy
    _markdownCache = buildMarkdown(verdict, report, findings, results);

    document.getElementById("results").classList.add("active");
  }

  function buildMarkdown(verdict, report, findings, results) {
    const icons = { APPROVE: "✅", REQUEST_CHANGES: "❌", NEEDS_DISCUSSION: "💬" };
    let md = `## ${icons[verdict] || ""} ${verdict}\n\n_${report.summary || ""}_\n\n**Reason:** ${report.verdict_reason || ""}\n\n`;
    if (findings.length > 0) {
      md += "### Findings\n\n| Severity | Category | File | Line | Issue | Suggestion |\n|---|---|---|---|---|---|\n";
      findings.forEach(f => { md += `| ${f.severity} | ${f.category} | \`${f.file_name}\` | ${f.line_number} | ${f.message} | ${f.suggestion} |\n`; });
    }
    return md;
  }

  function copyMarkdown() {
    navigator.clipboard.writeText(_markdownCache).then(() => {
      const btn = document.querySelector(".copy-btn");
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = "Copy as Markdown"; }, 2000);
    });
  }

  function showError(msg) {
    document.getElementById("error-display").innerHTML =
      `<div class="error-card">❌ ${msg}</div>`;
  }
</script>
</body>
</html>
